# ===========================================
# GIFTMAKEBOT DEVELOPMENT DOCKER COMPOSE
# ===========================================
# Development environment with debugging and hot reload
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # ===========================================
  # DEVELOPMENT OVERRIDES
  # ===========================================
  
  nginx:
    # Development nginx with verbose logging
    command: >
      sh -c "nginx-debug -g 'daemon off; error_log /var/log/nginx/error.log debug;'"
    environment:
      - NGINX_DEBUG=1
    volumes:
      # Mount nginx config for live editing
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      # Use development port
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"

  redis:
    # Development redis with debugging
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} 
      --loglevel debug --logfile /var/log/redis/redis.log
    volumes:
      - ${REDIS_VOLUME:-redis_dev_data}:/data
      - ./logs/redis:/var/log/redis
    ports:
      # Expose redis port for development tools
      - "${REDIS_PORT:-6380}:6379"

  rabbitmq:
    # Development RabbitMQ with detailed logging
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-dev_admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-DevRabbitMQ@2025}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/dev}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
      - RABBITMQ_LOG_LEVEL=debug
    volumes:
      - ${RABBITMQ_DATA_VOLUME:-rabbitmq_dev_data}:/var/lib/rabbitmq
      - ${RABBITMQ_LOGS_VOLUME:-rabbitmq_dev_logs}:/var/log/rabbitmq
      - ./logs/rabbitmq:/var/log/rabbitmq/dev
    ports:
      # Expose management interface for development
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"

  telegram-bot:
    # Development bot with hot reload
    build:
      context: ./services/telegram-bot
      dockerfile: Dockerfile
      target: development
    volumes:
      # Mount source code for hot reload
      - ./services/telegram-bot:/app:cached
      - ./logs/telegram-bot:/var/log/php
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=debug
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_SUPER_ADMIN_ID=${TELEGRAM_SUPER_ADMIN_ID}

  api-gateway:
    # Development API with debugging
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
      target: development
    volumes:
      # Mount source code for hot reload
      - ./services/api-gateway:/app:cached
      - ./logs/api-gateway:/var/log/php
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=debug
      - CORS_ENABLED=true
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}

  health:
    # Development health service
    build:
      context: ./services/health
      dockerfile: Dockerfile
      target: development
    volumes:
      # Mount source code for hot reload
      - ./services/health:/app:cached
      - ./logs/health:/var/log/php
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=debug
      - HEALTH_CHECK_INTERVAL=10

  web_app:
    # Development React app with hot reload
    build:
      context: ./services/web_app
      dockerfile: Dockerfile
      target: development
    volumes:
      # Mount source code for hot reload
      - ./services/web_app:/app:cached
      - /app/node_modules
      - ./logs/web_app:/var/log/nginx
    ports:
      - "${WEB_APP_PORT:-3001}:80"
      # Vite dev server port
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:${HTTP_PORT:-8080}/api
      - VITE_HOT_RELOAD=${HOT_RELOAD:-true}

# ===========================================
# DEVELOPMENT VOLUMES
# ===========================================
volumes:
  redis_dev_data:
    driver: local
  rabbitmq_dev_data:
    driver: local
  rabbitmq_dev_logs:
    driver: local

# ===========================================
# DEVELOPMENT NETWORKS
# ===========================================
networks:
  giftmakebot_dev_network:
    driver: ${NETWORK_DRIVER:-bridge}
    name: ${NETWORK_NAME:-giftmakebot_dev_network}
# ===========================================
# GIFTMAKEBOT PRODUCTION DOCKER COMPOSE
# ===========================================
# Production environment with security and performance optimizations
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ===========================================
  # PRODUCTION OVERRIDES
  # ===========================================
  
  nginx:
    # Production nginx with optimizations
    command: >
      sh -c "nginx -g 'daemon off; worker_processes auto; worker_connections 2048;'"
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=2048
    volumes:
      # SSL certificates (mount your certificates here)
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  redis:
    # Production redis with persistence and memory limits
    command: >
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} 
      --maxmemory 512mb --maxmemory-policy allkeys-lru
      --save 300 100 --save 60 1000
    volumes:
      - ${REDIS_VOLUME:-redis_prod_data}:/data
    # No exposed ports in production (internal only)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  rabbitmq:
    # Production RabbitMQ with clustering support
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}
      - RABBITMQ_VM_MEMORY_HIGH_WATERMARK=0.7
      - RABBITMQ_DISK_FREE_LIMIT=1GB
    volumes:
      - ${RABBITMQ_DATA_VOLUME:-rabbitmq_prod_data}:/var/lib/rabbitmq
      - ${RABBITMQ_LOGS_VOLUME:-rabbitmq_prod_logs}:/var/log/rabbitmq
    # Management interface only accessible internally
    ports:
      # Only expose management port if needed (comment out for security)
      - "localhost:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'

  telegram-bot:
    # Production bot optimized
    build:
      context: ./services/telegram-bot
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=error
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_SUPER_ADMIN_ID=${TELEGRAM_SUPER_ADMIN_ID}
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=60
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  api-gateway:
    # Production API with rate limiting
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=error
      - CORS_ENABLED=false
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=30
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  health:
    # Production health service
    build:
      context: ./services/health
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=error
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-30}
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - PHP_MEMORY_LIMIT=128M
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  web_app:
    # Production React app
    build:
      context: ./services/web_app
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
      - NGINX_WORKER_PROCESSES=auto
    # No external port (served via main nginx)
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

# ===========================================
# PRODUCTION VOLUMES
# ===========================================
volumes:
  redis_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/giftmakebot/data/redis
  rabbitmq_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/giftmakebot/data/rabbitmq
  rabbitmq_prod_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/giftmakebot/logs/rabbitmq

# ===========================================
# PRODUCTION NETWORKS
# ===========================================
networks:
  giftmakebot_prod_network:
    driver: ${NETWORK_DRIVER:-bridge}
    name: ${NETWORK_NAME:-giftmakebot_prod_network}
    driver_opts:
      com.docker.network.bridge.name: giftmakebot-prod
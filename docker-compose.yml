# ===========================================
# GIFTMAKEBOT BASE DOCKER COMPOSE
# ===========================================
# Base configuration for all environments
# Use with environment-specific overrides:
# - Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# - Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  health:
    build: ./services/health
    container_name: ${HEALTH_CONTAINER_NAME:-giftmakebot_health}
    depends_on:
      - redis
      - rabbitmq
      - telegram-bot
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-false}

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: ${NGINX_CONTAINER_NAME:-giftmakebot_nginx}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/nginx/ssl:/etc/nginx/ssl:ro
      - ./services/telegram-bot:/app:ro
    depends_on:
      - telegram-bot
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-giftmakebot_redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server ${REDIS_COMMAND_OPTIONS:---appendonly yes} --requirepass ${REDIS_PASSWORD}

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3-management-alpine}
    container_name: ${RABBITMQ_CONTAINER_NAME:-giftmakebot_rabbitmq}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"           # AMQP port
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-admin123}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
      - RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE:-rabbitmq-cluster-cookie}

  telegram-bot:
    build: ./services/telegram-bot
    container_name: ${TELEGRAM_BOT_CONTAINER_NAME:-giftmakebot_telegram}
    depends_on:
      - redis
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_SUPER_ADMIN_ID=${TELEGRAM_SUPER_ADMIN_ID}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-false}

  api-gateway:
    build: ./services/api-gateway
    container_name: ${API_GATEWAY_CONTAINER_NAME:-giftmakebot_api_gateway}
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEBUG=${DEBUG:-false}

  web_app:
    build: ./services/web_app
    container_name: ${WEB_APP_CONTAINER_NAME:-giftmakebot_webapp}
    ports:
      - "${WEB_APP_PORT:-3000}:80"
    depends_on:
      - api-gateway
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  rabbitmq_logs:
    driver: local

networks:
  giftmakebot_network:
    driver: ${NETWORK_DRIVER:-bridge}

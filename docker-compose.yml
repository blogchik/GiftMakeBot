services:

  health:
    build: ./services/health
    container_name: ${HEALTH_CONTAINER_NAME:-giftmakebot_health}
    volumes:
      - ./services/health:/app
    depends_on:
      - redis
      - telegram-bot
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: ${NGINX_CONTAINER_NAME:-giftmakebot_nginx}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./services/nginx/ssl:/etc/nginx/ssl:ro
      - ./services/telegram-bot:/app:ro
    depends_on:
      - telegram-bot
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ${REDIS_CONTAINER_NAME:-giftmakebot_redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server ${REDIS_COMMAND_OPTIONS:---appendonly yes} --requirepass ${REDIS_PASSWORD}

  telegram-bot:
    build: ./services/telegram-bot
    container_name: ${TELEGRAM_BOT_CONTAINER_NAME:-giftmakebot_telegram}
    volumes:
      - ./services/telegram-bot:/app
    depends_on:
      - redis
    networks:
      - giftmakebot_network
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_SUPER_ADMIN_ID=${TELEGRAM_SUPER_ADMIN_ID}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  giftmakebot_network:
    driver: bridge

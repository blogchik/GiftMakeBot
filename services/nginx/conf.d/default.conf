server {
    listen 80;
    server_name localhost;
    
    # API Gateway routing - All /api/* requests go to api-gateway service
    location /api/ {
        fastcgi_pass api-gateway:9000;
        fastcgi_param SCRIPT_FILENAME /app/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }
    
    # Health Monitoring API - Main endpoint
    location /health {
        fastcgi_pass health:9000;
        fastcgi_param SCRIPT_FILENAME /app/index.php;
        fastcgi_read_timeout 30;
        fastcgi_connect_timeout 5;
        include fastcgi_params;
    }
    
    # Telegram Bot webhook endpoint
    location /bot/ {
        fastcgi_pass telegram-bot:9000;
        fastcgi_param SCRIPT_FILENAME /app/index.php;
        include fastcgi_params;
    }
    
    # Main React web application - Proxy to web_app container
    location / {
        proxy_pass http://web_app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed for development)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}